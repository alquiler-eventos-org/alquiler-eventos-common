                    nullable: false
              - column:
                  name: rol_id
                  type: INT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_rolpermiso_rol
                    references: roles(id)
              - column:
                  name: permiso_id
                  type: INT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_rolpermiso_permiso
                    references: permisos(id)

  - changeSet:
      id: 9-crear-tabla-equipos
      author: alquilereventos
      changes:
        - createTable:
            tableName: equipos
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: nombre
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: categoria_id
                  type: INT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_equipo_categoria
                    references: categorias_equipo(id)
              - column:
                  name: stock
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: precio_dia
                  type: DECIMAL(10, 2)
                  constraints:
                    nullable: false
              - column:
                  name: estado
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

  - changeSet:
      id: 10-crear-tabla-ordenes_alquiler
      author: alquilereventos
      changes:
        - createTable:
            tableName: ordenes_alquiler
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: cliente_id
                  type: INT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_orden_alquiler_cliente
                    references: clientes(id)
              - column:
                  name: usuario_id
                  type: INT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_orden_alquiler_usuario
                    references: usuarios(id)
              - column:
                  name: fecha_evento
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: fecha_devolucion
                  type: DATE
              - column:
                  name: estado
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: total
                  type: DECIMAL(12, 2)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

