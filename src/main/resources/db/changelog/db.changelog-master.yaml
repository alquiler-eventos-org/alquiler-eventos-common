databaseChangeLog:
  - changeSet:
      id: 1-crear-tabla-roles
      author: alquilereventos
      changes:
        - createTable:
            tableName: roles
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: nombre
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: descripcion
                  type: VARCHAR(255)
              - column:
                  name: es_administrador
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

  - changeSet:
      id: 2-crear-tabla-permisos
      author: alquilereventos
      changes:
        - createTable:
            tableName: permisos
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: nombre
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: recurso
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: accion
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

  - changeSet:
      id: 3-crear-tabla-categorias_equipo
      author: alquilereventos
      changes:
        - createTable:
            tableName: categorias_equipo
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: nombre
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true

  - changeSet:
      id: 4-crear-tabla-proveedores
      author: alquilereventos
      changes:
        - createTable:
            tableName: proveedores
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: nombre
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: contacto
                  type: VARCHAR(100)
              - column:
                  name: telefono
                  type: VARCHAR(50)
              - column:
                  name: email
                  type: VARCHAR(150)
              - column:
                  name: direccion
                  type: VARCHAR(255)

  - changeSet:
      id: 5-crear-tabla-clientes
      author: alquilereventos
      changes:
        - createTable:
            tableName: clientes
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: nombre
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: apellido
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: telefono
                  type: VARCHAR(50)
              - column:
                  name: email
                  type: VARCHAR(150)
                  constraints:
                    unique: true
              - column:
                  name: documento
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: direccion
                  type: VARCHAR(255)
              - column:
                  name: notas
                  type: TEXT

  - changeSet:
      id: 6-crear-tabla-configuraciones
      author: alquilereventos
      changes:
        - createTable:
            tableName: configuraciones
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: clave
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: valor
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

  - changeSet:
      id: 7-crear-tabla-usuarios
      author: alquilereventos
      changes:
        - createTable:
            tableName: usuarios
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: nombre
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: rol_id
                  type: INT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_usuario_rol
                    references: roles(id)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

  - changeSet:
      id: 8-crear-tabla-rol_permisos
      author: alquilereventos
      changes:
        - createTable:
            tableName: rol_permisos
